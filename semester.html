<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesters - StudyVault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar glass">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">📚</span>
                <span class="logo-text">StudyVault</span>
            </a>
            <button class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="semester-main">
        <div class="semester-header">
            <h1 id="streamTitle">All Semesters</h1>
            <div class="filter-bar glass">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="sem1">Sem 1</button>
                <button class="filter-btn" data-filter="sem2">Sem 2</button>
                <button class="filter-btn" data-filter="sem3">Sem 3</button>
                <button class="filter-btn" data-filter="sem4">Sem 4</button>
                <button class="filter-btn" data-filter="sem5">Sem 5</button>
                <button class="filter-btn" data-filter="sem6">Sem 6</button>
            </div>
        </div>

        <div class="subjects-grid" id="subjectsGrid">
            <!-- Dynamically loaded -->
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
